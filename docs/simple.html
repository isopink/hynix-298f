<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigma Engine 심플</title>
<meta name="description" content="Sigma Engine 대시보드 심플 시안 , 한국식 색과 한글">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 11-12 S.Lee 심플 시안: 색은 뜻 하나씩 — 빨강 = 수익, 파랑 = 손실, 초록 = 상태 정상만. 장식 · 움직임 없음 */
:root {
  --bg: #f2f4f6; --card: #ffffff; --ink: #191f28; --sub: #6b7684; --faint: #8b95a1; --line: #e5e8eb;
  --up: #f04452; --down: #3182f6; --ok: #00a661; --warn: #f04452; --chip: #f2f4f6;
  --sigma: #191f28; --sion: #8b95a1; --bm: #b0b8c1;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101013; --card: #1b1d22; --ink: #f2f4f6; --sub: #9aa1ab; --faint: #8b95a1; --line: #2b2f36;
    --up: #ff5a65; --down: #4e94ff; --ok: #2fca7f; --warn: #ff5a65; --chip: #25282e; --sigma: #f2f4f6; --sion: #8b95a1; --bm: #5b6270; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--sub); }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
header .meta { color: var(--sub); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: default; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.pill.bad i { background: var(--warn); } .pill.off i { background: var(--faint); }
.card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 12px; }
.card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
.card h2 small { font-weight: 500; color: var(--sub); font-size: 13px; margin-left: 6px; }
.hero .label { color: var(--sub); font-size: 14px; font-weight: 500; }
.hero .big { font-size: 44px; font-weight: 700; letter-spacing: -1px; line-height: 1.15; margin: 4px 0 6px; }
.hero .vs { font-size: 15px; color: var(--sub); }
.hero .vs b { font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.kpi { background: var(--chip); border-radius: 12px; padding: 12px 14px; }
.kpi .k { color: var(--sub); font-size: 13px; }
.kpi .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
.kpi .v small { font-size: 13px; font-weight: 500; color: var(--sub); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--sub); font-size: 13px; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { overflow: visible; }
#chart { width: 100%; }
#chart svg { display: block; width: 100%; }
#chart text { font-family: inherit; font-size: 12px; fill: var(--faint); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .card { margin-bottom: 0; }
.grid2 + footer, .grid2 { margin-bottom: 0; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--sub); font-weight: 500; font-size: 13px; padding: 0 0 8px; }
td { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
th.r, td.r { text-align: right; }
td .w { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
td .w b { display: block; height: 100%; background: var(--sub); opacity: .55; }
tr.cash td { color: var(--sub); }
.dec { list-style: none; margin: 0; padding: 0; }
.dec li { padding: 12px 0; border-top: 1px solid var(--line); }
.dec li:first-child { border-top: 0; padding-top: 0; }
.dec .row { display: flex; align-items: center; gap: 8px; }
.dec .nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dec .cf { color: var(--sub); font-size: 13px; }
.dec p { margin: 4px 0 0; color: var(--sub); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--sub); flex: none; }
.tag.buy { color: var(--up); background: color-mix(in srgb, var(--up) 12%, transparent); }
.tag.sell { color: var(--down); background: color-mix(in srgb, var(--down) 12%, transparent); }
.tabs { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; border: 0; background: transparent; color: var(--sub); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); }
.tabs button:focus-visible, .pill:focus-visible { outline: 2px solid var(--down); outline-offset: 2px; }
.empty { color: var(--sub); font-size: 14px; padding: 8px 0; }
footer { color: var(--faint); font-size: 12px; text-align: center; margin-top: 24px; }
footer a { color: var(--sub); }
/* PC 넓은 화면: 위 = 수익률 카드 | 추이 차트, 아래 = 보유 종목 | 최근 판단 | 최근 체결 세 칸 */
.grid3 .trades { grid-column: 1 / -1; }
@media (min-width: 1100px) {
  .wrap { max-width: 1320px; padding: 28px 32px 48px; }
  .top { display: grid; grid-template-columns: minmax(340px, 1fr) 2fr; gap: 12px; margin-bottom: 12px; }
  .top .card { margin-bottom: 0; }
  .hero { display: flex; flex-direction: column; }
  .hero .big { font-size: 56px; }
  .kpis { grid-template-columns: 1fr; margin-top: auto; padding-top: 18px; }
  .kpi { display: flex; justify-content: space-between; align-items: baseline; }
  .grid3 { grid-template-columns: 1fr 1.25fr 1fr; align-items: start; }
  .grid3 .trades { grid-column: auto; }
  .grid3 .trades td:first-child { white-space: nowrap; }
}
@media (max-width: 720px) {
  .grid2 { grid-template-columns: 1fr; }
  .hero .big { font-size: 38px; }
  .kpi { padding: 10px 12px; } .kpi .v { font-size: 16px; } .kpi .v small { display: block; font-size: 12px; }
  header h1 { font-size: 18px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Sigma Engine</h1><div class="meta" id="asof">불러오는 중</div></div>
    <span class="pill off" id="health" tabindex="0"><i></i><span>확인 중</span></span>
  </header>

  <div class="top">
  <section class="card hero" aria-labelledby="h-ret">
    <div class="label" id="h-ret">누적 수익률 <span style="color:var(--faint)">시작 5,000만 원</span></div>
    <div class="big num" id="ret">–</div>
    <div class="vs num" id="vs">–</div>
    <div class="kpis">
      <div class="kpi"><div class="k">오늘</div><div class="v num" id="k-day">–</div></div>
      <div class="kpi"><div class="k">주식 비중</div><div class="v num" id="k-w">–</div></div>
      <div class="kpi"><div class="k">체결</div><div class="v num" id="k-n">–</div></div>
    </div>
  </section>

  <section class="card" aria-labelledby="h-chart">
    <h2 id="h-chart">누적 수익률 추이</h2>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
  </section>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" aria-selected="true" data-eng="sigma">Sigma</button>
    <button role="tab" aria-selected="false" data-eng="sion">SiON 시험</button>
  </div>

  <div class="grid2 grid3">
    <section class="card" aria-labelledby="h-hold">
      <h2 id="h-hold">보유 종목 <small id="hold-n"></small></h2>
      <table><thead><tr><th>종목</th><th class="r">비중</th><th class="r">수익률</th></tr></thead><tbody id="hold"></tbody></table>
    </section>
    <section class="card" aria-labelledby="h-dec">
      <h2 id="h-dec">최근 판단 <small id="dec-t"></small></h2>
      <ul class="dec" id="dec"></ul>
    </section>
  <section class="card trades" aria-labelledby="h-tr">
    <h2 id="h-tr">최근 체결</h2>
    <table><thead><tr><th>시각</th><th>종목</th><th class="r">구분</th><th class="r">금액</th></tr></thead><tbody id="trades"></tbody></table>
  </section>
  </div>

  <footer>심플 시안, 수익은 빨강 손실은 파랑<br><a href="index.html">기존 화면 보기</a><br>Designed by S.Lee &amp; M.Park</footer>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
  const CFG = window.DASH_CONFIG || {}, INIT = 50000000, ADJ = 0.001;   // 대회 게시판 기준 보정 (index.html OFFICIAL_ADJ 와 같음)
  const $ = id => document.getElementById(id);
  const kst = ts => new Date(Date.parse(ts) + 9 * 3600e3).toISOString();
  const today = kst(new Date().toISOString()).slice(0, 10);
  const pct = (v, d = 2) => v == null || isNaN(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d) + '%';
  const pp = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(2) + '%p';
  const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const won = v => Math.round(v).toLocaleString('ko-KR');
  const man = v => (v >= 1e8 ? (v / 1e8).toFixed(2) + '억' : Math.round(v / 1e4).toLocaleString('ko-KR') + '만') + '원';
  const md = s => +s.slice(5, 7) + '/' + +s.slice(8, 10);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const get = n => fetch(`data/${n}.json?t=${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null);
  const url = (CFG.supabaseUrl || '').replace(/\/$/, ''), key = CFG.supabaseAnonKey || '', H = { apikey: key, Authorization: 'Bearer ' + key };
  const sb = q => url && key ? fetch(`${url}/rest/v1/${q}`, { headers: H }).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null);
  const adjUpTo = (trades, date) => ADJ * d3.sum(trades.filter(t => String(t.time).slice(0, 10) <= date), t => +t.amount || (+t.qty * +t.price) || 0);

  let S = {}, ENG = 'sigma';

  async function load() {
    const [equity, holdings, trades, decision, status, kd, shadow] = await Promise.all(['equity', 'holdings', 'trades', 'decision', 'status', 'kodex200', 'shadow'].map(get));
    const [snaps, hb, shl] = await Promise.all([
      sb(`snapshots?select=ts,account,total,holdings&ts=gte.${today}T00:00:00%2B09:00&order=ts.desc&limit=4`),
      sb('heartbeat?select=ts&host=eq.desktop&limit=1'),
      sb('shadow_snapshots?select=ts,total,holdings,status&order=ts.desc&limit=1')
    ]);
    S = { equity: equity || [], holdings: holdings || [], trades: trades || [], decision: decision || {}, status: status || {}, kd, shadow, snaps: snaps || [], hb, shl: shl && shl[0] };
    // 마감 기록이 빠진 지난 거래일은 그날 마지막 스냅샷으로 (index.html fillMissingDays 와 같은 방식)
    const have = new Set(S.equity.map(r => r.date)), last = S.equity.length ? S.equity[S.equity.length - 1].date : '2026-11-02';
    const miss = d3.utcDays(new Date(last + 'T00:00:00Z'), new Date(today + 'T00:00:00Z')).map(d => d.toISOString().slice(0, 10)).filter(d => !have.has(d) && new Date(d).getUTCDay() % 6);
    for (const d of miss) {
      const nx = d3.utcDay.offset(new Date(d + 'T00:00:00Z'), 1).toISOString().slice(0, 10);
      const r = await sb(`snapshots?select=ts,total&ts=gte.${d}T00:00:00%2B09:00&ts=lt.${nx}T00:00:00%2B09:00&order=ts.desc&limit=1`);
      if (r && r[0]) S.equity.push({ date: d, total: +r[0].total });
    }
    render();
  }

  function series() {
    const eq = S.equity.map(r => ({ date: r.date, total: +r.total }));
    let liveHold = null;
    if (S.snaps.length) {   // 오늘 실시간 자산 (계좌별 최신값 합)
      const by = new Map(); S.snaps.forEach(s => { if (!by.has(s.account)) by.set(s.account, s); });
      const tot = d3.sum([...by.values()], s => +s.total), i = eq.findIndex(r => r.date === today);
      if (i >= 0) eq[i].total = tot; else eq.push({ date: today, total: tot });
      liveHold = [...by.values()][0].holdings;
    }
    eq.sort((a, b) => a.date < b.date ? -1 : 1);
    const bm = S.kd && S.kd.days ? S.kd : null, b0 = bm ? +bm.start : null;
    let lastB = null;
    eq.forEach((r, i) => {
      r.adj = r.total + adjUpTo(S.trades, r.date); r.ret = r.adj / INIT - 1;
      const c = bm && bm.days[r.date] ? bm.days[r.date].c : lastB; lastB = c; r.bret = b0 && c ? c / b0 - 1 : null;
      r.day = r.adj / (i ? eq[i - 1].adj : INIT) - 1;
    });
    // SiON: 시작일까지는 실제 계좌 보정분 + 그 뒤 SiON 체결 × 0.1%
    let sion = [];
    const sh = S.shadow;
    if (sh && sh.daily) {
      const since = String(sh.start || '').slice(0, 10), sTr = (S.shl && S.shl.status && S.shl.status.trades) || sh.trades || [];
      const before = since ? adjUpTo(S.trades.filter(t => String(t.time).slice(0, 10) < since), since) : 0;
      const sAdj = d => before + adjUpTo(sTr.filter(t => String(t.time).slice(0, 10) >= since), d);
      sion = sh.daily.map(r => ({ date: r.date, ret: (+r.total + sAdj(r.date)) / INIT - 1, total: +r.total + sAdj(r.date) }));
      if (S.shl && S.shl.total) {
        const d = kst(S.shl.ts).slice(0, 10), t = +S.shl.total + sAdj(d), i = sion.findIndex(r => r.date === d);
        const row = { date: d, ret: t / INIT - 1, total: t };
        if (i >= 0) sion[i] = row; else sion.push(row);
      }
      const lastD = eq.length ? eq[eq.length - 1].date : today;
      sion = sion.filter(r => r.date <= lastD);
      const seed = eq.filter(r => sion.length && r.date < sion[0].date).pop();
      if (seed) sion.unshift({ date: seed.date, ret: seed.ret });
    }
    return { eq, sion, liveHold };
  }

  function render() {
    const { eq, sion, liveHold } = series();
    const last = eq[eq.length - 1] || { ret: 0, bret: 0, day: 0, adj: INIT, date: today };
    $('asof').textContent = S.snaps.length ? `${md(last.date)} ${kst(S.snaps[0].ts).slice(11, 16)} 실시간` : `${md(last.date)} 마감 기준`;
    // 상태: 연결 신호 + 에이전트 마지막 실행
    const hbAge = S.hb && S.hb[0] ? (Date.now() - Date.parse(S.hb[0].ts)) / 60e3 : null;
    const st = S.status, pill = $('health');
    let state = 'ok', text = '정상 작동 중', tip = [];
    if (hbAge == null) { state = 'off'; text = '연결 확인 불가'; }
    else if (hbAge > 3) { state = 'bad'; text = '데스크톱 연결 끊김'; tip.push(`마지막 신호 ${hbAge < 120 ? Math.round(hbAge) + '분' : Math.round(hbAge / 60) + '시간'} 전`); }
    else tip.push('데스크톱 연결됨');
    if (st.last_run) tip.push(`마지막 판단 ${st.last_run.slice(5)} ${st.last_ok === false ? '실패' : '정상'}`);
    if (st.note) tip.push(st.note);
    pill.className = 'pill ' + state; pill.querySelector('span').textContent = text; pill.title = tip.join('\n');
    // 큰 숫자
    $('ret').textContent = pct(last.ret); $('ret').className = 'big num ' + cls(last.ret);
    const ex = last.bret != null ? last.ret - last.bret : null;
    $('vs').innerHTML = last.bret == null ? '' : `KODEX 200 ${pct(last.bret)} 대비 <b class="${cls(ex)}">${pp(ex)}</b> ${ex >= 0 ? '앞섬' : '뒤처짐'}`;
    $('k-day').textContent = pct(last.day); $('k-day').className = 'v num ' + cls(last.day);
    $('k-n').innerHTML = `${S.trades.length}<small>건</small>`;
    drawChart(eq, sion);
    renderEngine(liveHold, last);
  }

  function renderEngine(liveHold, last) {
    const sion = ENG === 'sion', sh = S.shadow || {};
    let hold, total, dec, trades, cap;
    if (!sion) {
      hold = (liveHold && liveHold.length ? liveHold : S.holdings).filter(h => +h.qty);
      total = last.total || INIT; dec = S.decision; trades = S.trades; cap = S.decision.cap || S.equity.length && S.equity[S.equity.length - 1].cap;
    } else {
      const L = S.shl || {};
      hold = ((L.holdings && L.holdings.length ? L.holdings : sh.holdings) || []).filter(h => +h.qty);
      total = +L.total || (sh.now && sh.now.shadow_total) || INIT;
      dec = (L.status && L.status.decision && L.status.decision.items ? L.status.decision : sh.decision) || {};
      trades = ((L.status && L.status.trades) || sh.trades || []).map(t => ({ ...t, amount: t.amount || t.qty * t.price }));
      cap = dec.cap || { '상승': .9, '횡보': .7, '하락': .6 }[dec.regime];
    }
    const val = h => +h.value || +h.price * +h.qty || 0;
    const stock = d3.sum(hold, val);
    $('k-w').innerHTML = `${Math.round(stock / total * 100)}%` + (cap ? `<small> 상한 ${Math.round(cap * 100)}%</small>` : '');
    if (sion) $('k-n').innerHTML = `${trades.length}<small>건</small>`; else $('k-n').innerHTML = `${S.trades.length}<small>건</small>`;
    // 보유 종목
    const rows = hold.map(h => ({ name: h.name, w: val(h) / total, p: h.pnl_pct == null ? null : +h.pnl_pct })).sort((a, b) => (b.p ?? -9) - (a.p ?? -9));
    $('hold-n').textContent = rows.length ? `${rows.length}종목` : '';
    $('hold').innerHTML = rows.map(r => `<tr><td>${esc(r.name)}<span class="w"><b style="width:${Math.min(100, r.w / .2 * 100).toFixed(0)}%"></b></span></td><td class="r num">${(r.w * 100).toFixed(1)}%</td><td class="r num ${cls(r.p)}">${pct(r.p)}</td></tr>`).join('')
      + `<tr class="cash"><td>현금</td><td class="r num">${Math.max(0, (1 - stock / total) * 100).toFixed(1)}%</td><td class="r num">${man(Math.max(0, total - stock))}</td></tr>`;
    if (!rows.length) $('hold').insertAdjacentHTML('afterbegin', '<tr><td colspan="3" class="empty">보유 종목이 없어요</td></tr>');
    // 최근 판단: 매수 · 매도 먼저, 그다음 확신도 높은 순 6개
    const order = { '매수': 0, '매도': 1, '보유': 2, '관망': 3 };
    const items = (dec.items || []).slice().sort((a, b) => (order[a.action] ?? 4) - (order[b.action] ?? 4) || (+b.confidence || 0) - (+a.confidence || 0)).slice(0, 6);
    $('dec-t').textContent = dec.time ? `${md(dec.time)} ${dec.time.slice(11, 16)}` + (dec.regime ? `, ${dec.regime}장` : '') : '';
    $('dec').innerHTML = items.length ? items.map(it => {
      const t = it.action === '매수' ? 'buy' : it.action === '매도' ? 'sell' : '';
      return `<li><div class="row"><span class="tag ${t}">${esc(it.action)}</span><span class="nm">${esc(it.name)}</span><span class="cf num">확신 ${Math.round((+it.confidence || 0) * 100)}</span></div>${it.decision ? `<p>${esc(it.decision)}</p>` : ''}</li>`;
    }).join('') : '<li class="empty">판단을 기다리는 중이에요</li>';
    // 최근 체결 8건
    const tr = trades.slice().sort((a, b) => a.time < b.time ? 1 : -1).slice(0, 8);
    $('trades').innerHTML = tr.length ? tr.map(t => `<tr><td class="num">${md(t.time)} ${t.time.slice(11, 16)}</td><td>${esc(t.name)}</td><td class="r ${t.side === '매수' ? 'up' : 'down'}">${esc(t.side)}</td><td class="r num">${man(+t.amount || +t.qty * +t.price)}</td></tr>`).join('')
      : '<tr><td colspan="4" class="empty">체결 기록이 없어요</td></tr>';
  }

  function drawChart(eq, sion) {
    const el = $('chart'); el.innerHTML = '';
    const W = el.clientWidth, Hh = W < 560 ? 220 : W > 700 ? 300 : 280, m = { t: 10, r: 12, b: 26, l: 46 };
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${W} ${Hh}`).attr('height', Hh).attr('role', 'img')
      .attr('aria-label', `누적 수익률 추이. Sigma ${pct(eq.length ? eq[eq.length - 1].ret : 0)}`);
    if (!eq.length) return;
    const dates = eq.map(r => r.date), x = d3.scalePoint(dates, [m.l, W - m.r]).padding(.3);
    const all = eq.flatMap(r => [r.ret, r.bret]).concat(sion.map(r => r.ret)).filter(v => v != null);
    const y = d3.scaleLinear([Math.min(0, d3.min(all)), Math.max(0, d3.max(all))], [Hh - m.b, m.t]).nice(4);
    const f = v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%';
    svg.append('g').selectAll('line').data(y.ticks(4)).join('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y).attr('y2', y)
      .attr('stroke', css('--line')).attr('stroke-width', d => d === 0 ? 1.5 : 1);
    svg.append('g').selectAll('text').data(y.ticks(4)).join('text').attr('x', m.l - 8).attr('y', d => y(d) + 4).attr('text-anchor', 'end').text(f);
    const step = Math.ceil(dates.length / (W < 560 ? 5 : 9));
    svg.append('g').selectAll('text').data(dates.filter((d, i) => i % step === 0 || i === dates.length - 1)).join('text')
      .attr('x', d => x(d)).attr('y', Hh - 6).attr('text-anchor', 'middle').text(md);
    const line = d3.line().x(d => x(d.date)).y(d => y(d.v)).defined(d => d.v != null && x(d.date) != null).curve(d3.curveMonotoneX);
    const draw = (data, color, w, dash) => svg.append('path').attr('d', line(data)).attr('fill', 'none').attr('stroke', color).attr('stroke-width', w).attr('stroke-dasharray', dash || null).attr('stroke-linecap', 'round');
    draw(eq.map(r => ({ date: r.date, v: r.bret })), css('--bm'), 1.5, '2 4');
    if (sion.length) draw(sion.map(r => ({ date: r.date, v: r.ret })), css('--sion'), 1.5, '6 4');
    draw(eq.map(r => ({ date: r.date, v: r.ret })), css('--sigma'), 2.6);
    const lr = eq[eq.length - 1];
    svg.append('circle').attr('cx', x(lr.date)).attr('cy', y(lr.ret)).attr('r', 4).attr('fill', css('--sigma'));
    // 범례: 선 모양 + 마지막 값 (숫자만 빨강 · 파랑)
    const ls = sion.length ? sion[sion.length - 1].ret : null;
    const sw = (c, w, d) => `<svg width="22" height="6"><line x1="1" y1="3" x2="21" y2="3" stroke="${c}" stroke-width="${w}" ${d ? `stroke-dasharray="${d}"` : ''} stroke-linecap="round"/></svg>`;
    $('legend').innerHTML = `<span>${sw(css('--sigma'), 2.6)}Sigma <b class="num ${cls(lr.ret)}">${pct(lr.ret)}</b></span>`
      + (sion.length ? `<span>${sw(css('--sion'), 1.5, '6 4')}SiON 시험 <b class="num ${cls(ls)}">${pct(ls)}</b></span>` : '')
      + (lr.bret != null ? `<span>${sw(css('--bm'), 1.5, '2 4')}KODEX 200 <b class="num ${cls(lr.bret)}">${pct(lr.bret)}</b></span>` : '');
  }

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ENG = b.dataset.eng; [...$('tabs').children].forEach(x => x.setAttribute('aria-selected', x === b));
    const { liveHold, eq } = series(); renderEngine(liveHold, eq[eq.length - 1] || {});
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
  load(); setInterval(load, 60e3);   // 1분마다 새로 받음
})();
</script>
</body>
</html>
